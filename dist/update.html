<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5eb"><title>更新月饼的英语小屋</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f5eb;color:#294d42;font-family:system-ui,"Microsoft YaHei",sans-serif;line-height:1.8}main{max-width:620px;margin:7vh auto;padding:30px;background:#fffef8;border:1px solid #e3dfd1;border-radius:24px}h1{font-size:25px;margin:10px 0}p{font-size:15px}.badge{color:#9c6242;font-size:13px}strong{font-weight:650}progress{width:100%;height:14px;accent-color:#426c55;margin:18px 0 4px}button,a.primary{display:inline-block;border:0;border-radius:25px;background:#426c55;color:white;font:inherit;font-weight:600;padding:12px 24px;cursor:pointer;text-decoration:none;min-height:50px}button:disabled{opacity:.55;cursor:default}button.secondary{color:#426c55;background:#edf1e5}a{color:#426c55}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}#status{min-height:58px;font-size:14px}small{display:block;color:#7c806e;font-size:12px;margin-top:16px}[hidden]{display:none!important}@media(max-width:650px){main{margin:20px 14px;padding:24px}}</style></head>
<body><main><div class="badge">月饼和小熊猫的英语小屋</div><h1>把新的小冒险带回家</h1><p id="summary">正在联网确认最新课程…</p><p>这次更新会保留月饼的学习进度、贴纸和本机录音。</p><progress id="progress" value="0" max="1" aria-label="课程更新进度"></progress><p id="status" role="status">请保持网络连接，正在读取新课程。</p><div class="actions"><button id="start" disabled>正在准备…</button><button id="pause" class="secondary" hidden>暂停</button><a id="open" class="primary" hidden>打开新版课程</a></div><small>仍显示旧课程时，可以直接用本页更新到完整12周。全部资源校验通过后，会自动打开新课程，无需清除浏览器数据。</small><noscript>请在浏览器中启用JavaScript，再重新打开本页。</noscript></main>
<script>const script=document.createElement('script');script.type='module';script.src='./update.js?yb-update='+Date.now();script.onerror=()=>{document.querySelector('#status').textContent='更新工具暂时未能读取，请检查网络后重新打开本页。';};document.head.append(script);</script></body></html>
